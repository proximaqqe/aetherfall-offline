<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Aetherfall Arena</title><style>
*{box-sizing:border-box}body{margin:0;background:#091a22;color:#e6f8ff;font-family:system-ui}header{padding:10px 14px;display:flex;justify-content:space-between;align-items:center}h1{font-size:19px;margin:0;color:#74e5ff}small{color:#9ac0c9}button{border:1px solid #5494a9;border-radius:12px;background:#184455;color:white;padding:12px;font-weight:bold;touch-action:none}canvas{display:block;width:100%;max-height:72vh;aspect-ratio:16/10;background:#21483f;touch-action:none}.controls{display:flex;justify-content:space-between;align-items:center;padding:12px;gap:8px}.pad{display:grid;grid-template-columns:repeat(3,46px);gap:4px}.pad button{height:43px;padding:0}.abilities{display:flex;gap:8px}.abilities button{min-height:65px}#status{padding:8px 14px;color:#b5e6ec;font-size:14px}
</style></head><body><header><div><h1>⚔ AETHERFALL ARENA</h1><small>Offline browser prototype · 1v1</small></div><button id="restart">↻ Заново</button></header><div id="status"></div><canvas id="game" width="800" height="500"></canvas><div class="controls"><div class="pad"><span></span><button data-dir="up">▲</button><span></span><button data-dir="left">◀</button><button data-dir="down">▼</button><button data-dir="right">▶</button></div><div class="abilities"><button id="attack">⚔<br>Удар</button><button id="skill">✦<br>Волна</button></div></div><small style="display:block;padding:0 14px 15px">Двигай героя кнопками или пальцем по левой половине арены. Победи красного бота. Работает без интернета после загрузки страницы, пока она открыта.</small><script>
const cv=document.getElementById('game'),c=cv.getContext('2d'),status=document.getElementById('status'),keys=new Set();
let hero,bot,over,attackCooldown,skillCooldown,botCooldown,touch=null,elapsed=0,last=0,effects=[];
function reset(){hero={x:170,y:250,hp:100};bot={x:625,y:250,hp:100};over=false;attackCooldown=0;skillCooldown=0;botCooldown=0;elapsed=0;effects=[];keys.clear()}
reset();document.getElementById('restart').onclick=reset;
document.querySelectorAll('[data-dir]').forEach(b=>{let d=b.dataset.dir;b.addEventListener('pointerdown',e=>{e.preventDefault();keys.add(d);b.setPointerCapture(e.pointerId)});for(let n of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(n,()=>keys.delete(d))});
document.addEventListener('keydown',e=>{let m={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',a:'left',s:'down',d:'right'};if(m[e.key]){keys.add(m[e.key]);e.preventDefault()}if(e.key===' ')attack();if(e.key==='e')skill()});document.addEventListener('keyup',e=>{let m={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',a:'left',s:'down',d:'right'};if(m[e.key])keys.delete(m[e.key])});
const distance=()=>Math.hypot(hero.x-bot.x,hero.y-bot.y);
function flash(x,y,color){effects.push({x,y,t:.3,color})}
function attack(){if(over||attackCooldown>0)return;attackCooldown=.5;flash(hero.x,hero.y,'#8dfaff');if(distance()<90){bot.hp=Math.max(0,bot.hp-16);flash(bot.x,bot.y,'#ff6c77')}}
function skill(){if(over||skillCooldown>0)return;skillCooldown=4;flash(hero.x,hero.y,'#bd8aff');if(distance()<175){bot.hp=Math.max(0,bot.hp-32);flash(bot.x,bot.y,'#c18aff')}}
document.getElementById('attack').onclick=attack;document.getElementById('skill').onclick=skill;
function pos(e){let r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*800/r.width,y:(e.clientY-r.top)*500/r.height}}
cv.addEventListener('pointerdown',e=>{let p=pos(e);if(p.x<400){touch={id:e.pointerId,x:p.x,y:p.y,dx:0,dy:0};cv.setPointerCapture(e.pointerId)}else attack()});cv.addEventListener('pointermove',e=>{if(touch&&touch.id===e.pointerId){let p=pos(e);touch.dx=Math.max(-1,Math.min(1,(p.x-touch.x)/50));touch.dy=Math.max(-1,Math.min(1,(p.y-touch.y)/50))}});for(let n of ['pointerup','pointercancel'])cv.addEventListener(n,e=>{if(touch&&touch.id===e.pointerId)touch=null});
function bar(x,y,value,color){c.fillStyle='#10232d';c.fillRect(x-37,y-46,74,9);c.fillStyle=color;c.fillRect(x-37,y-46,74*Math.max(0,value)/100,9)}
function draw(){c.fillStyle='#1c433a';c.fillRect(0,0,800,500);for(let x=0;x<800;x+=50)for(let y=0;y<500;y+=50){c.fillStyle=(x+y)%100?'#20483f':'#1e463d';c.fillRect(x,y,49,49)}c.fillStyle='#697d71';c.fillRect(0,188,800,124);c.fillStyle='#829384';c.fillRect(0,210,800,80);c.strokeStyle='#aec3ac';c.setLineDash([16,12]);c.beginPath();c.moveTo(0,250);c.lineTo(800,250);c.stroke();c.setLineDash([]);for(let p of [[80,80],[320,85],[560,90],[100,420],[370,425],[680,420]]){c.fillStyle='#2a805a';c.beginPath();c.arc(...p,29,0,Math.PI*2);c.fill();c.fillStyle='#42a06b';c.beginPath();c.arc(p[0]-6,p[1]-7,21,0,Math.PI*2);c.fill()}for(let [o,col] of [[hero,'#47d8ff'],[bot,'#ff6878']]){c.fillStyle='#091e2699';c.beginPath();c.ellipse(o.x,o.y+15,25,9,0,0,Math.PI*2);c.fill();c.fillStyle=col;c.beginPath();c.arc(o.x,o.y,22,0,Math.PI*2);c.fill();c.lineWidth=4;c.strokeStyle='#e7ffff';c.stroke();bar(o.x,o.y,o.hp,col)}for(let p of effects){c.strokeStyle=p.color;c.lineWidth=5;c.beginPath();c.arc(p.x,p.y,30+(0.3-p.t)*190,0,Math.PI*2);c.stroke()}if(over){c.fillStyle='#071b27bb';c.fillRect(0,0,800,500);c.fillStyle='white';c.textAlign='center';c.font='bold 48px system-ui';c.fillText(hero.hp>0?'ПОБЕДА!':'ПОРАЖЕНИЕ',400,245);c.font='24px system-ui';c.fillText('Нажми «Заново», чтобы повторить матч',400,285);c.textAlign='left'}}
function tick(t){let dt=Math.min(.04,(t-last)/1000||0);last=t;if(!over){elapsed+=dt;attackCooldown=Math.max(0,attackCooldown-dt);skillCooldown=Math.max(0,skillCooldown-dt);botCooldown=Math.max(0,botCooldown-dt);let dx=Number(keys.has('right'))-Number(keys.has('left'))+(touch?.dx||0),dy=Number(keys.has('down'))-Number(keys.has('up'))+(touch?.dy||0),mag=Math.hypot(dx,dy);if(mag>.03){hero.x=Math.max(25,Math.min(775,hero.x+dx/Math.max(1,mag)*180*dt));hero.y=Math.max(35,Math.min(465,hero.y+dy/Math.max(1,mag)*180*dt))}let d=distance();if(d>63){bot.x+=(hero.x-bot.x)/d*86*dt;bot.y+=(hero.y-bot.y)/d*86*dt}else if(botCooldown===0){hero.hp=Math.max(0,hero.hp-10);botCooldown=1.1;flash(hero.x,hero.y,'#ff7777')}if(hero.hp===0||bot.hp===0)over=true}effects.forEach(e=>e.t-=dt);effects=effects.filter(e=>e.t>0);status.textContent='💙 Герой '+hero.hp+'/100    ❤️ Бот '+bot.hp+'/100    ⏱ '+Math.floor(elapsed)+'с'+(over?' · Матч окончен':'');document.getElementById('skill').textContent=skillCooldown>0?'✦ '+skillCooldown.toFixed(1)+'с':'✦ Волна';draw();requestAnimationFrame(tick)}requestAnimationFrame(tick);
</script></body></html>
